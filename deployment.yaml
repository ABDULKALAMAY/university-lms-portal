apiVersion: apps/v1
kind: Deployment
metadata:
  name: university-lms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: university-lms
  template:
    metadata:
      labels:
        app: university-lms
    spec:
      containers:
        - name: university-lms
          image: abdulkalamay/university-lms-portal:v1.0.0
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: university-lms-service
spec:
  type: NodePort
  selector:
    app: university-lms
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30014
